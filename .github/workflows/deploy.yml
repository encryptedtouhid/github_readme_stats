name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Test
        run: dotnet test src/GitHubStats.sln -c Release --nologo

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image name
        id: meta
        run: |
          IMAGE="${REGISTRY}/$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy deploy files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          source: "deploy/docker-compose.yml"
          target: "/opt/apps/github-readme-stats"
          strip_components: 1

      - name: Pull & restart containers
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          envs: APP_IMAGE,GH_STATS_TOKEN,REDIS_URL,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            mkdir -p /opt/apps/github-readme-stats && cd /opt/apps/github-readme-stats
            umask 077
            cat > .env <<EOT
            APP_IMAGE=${APP_IMAGE}
            GH_STATS_TOKEN=${GH_STATS_TOKEN}
            REDIS_URL=${REDIS_URL}
            EOT
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            docker compose pull app
            docker compose up -d --remove-orphans
            echo "${APP_IMAGE##*:}" > DEPLOYED_SHA
            docker image prune -f
            for i in $(seq 1 20); do
              if docker compose exec -T app curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
                echo "App healthy"; exit 0
              fi
              sleep 3
            done
            echo "App failed health check"; docker compose logs --tail=100 app; exit 1
