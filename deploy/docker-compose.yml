services:
  app:
    image: ${APP_IMAGE:-ghcr.io/encryptedtouhid/github_readme_stats:latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      GitHub__PersonalAccessTokens__0: ${GH_STATS_TOKEN}
      Cache__RedisConnectionString: ${REDIS_URL}
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-github-readme-stats.tuhidulhossain.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  caddy-data:
  caddy-config:
